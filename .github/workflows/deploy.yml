name: ASP.NET Core Multi-Branch Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:   # 👈 enables manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.x'

      - name: Restore dependencies
        run: dotnet restore ./MovieShop/MovieShop.csproj

      - name: Build
        run: dotnet build ./MovieShop/MovieShop.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./MovieShop/MovieShop.csproj -c Release -o ./MovieShop/publish/

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ./MovieShop/publish/

  deploy-main:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: publish
          path: ./MovieShop/publish/

      - name: Deploy to Production FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_MAIN }}
          username: ${{ secrets.FTP_USERNAME_MAIN }}
          password: ${{ secrets.FTP_PASSWORD_MAIN }}
          local-dir: ./MovieShop/publish/
          server-dir: ${{ secrets.FTP_PATH_MAIN }}

  deploy-develop:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: publish
          path: ./MovieShop/publish/

      - name: Deploy to Staging FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_DEV }}
          username: ${{ secrets.FTP_USERNAME_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}
          local-dir: ./MovieShop/publish/
          server-dir: ${{ secrets.FTP_PATH_DEV }}
